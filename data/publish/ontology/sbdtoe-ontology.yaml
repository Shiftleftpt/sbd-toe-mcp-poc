# ---------------------------------------------------------------------------
# macro_processes — vista processual MP1–MP5 (v2.5, 2026-09-06; gate ratificado + adenda do programme lead)
# ---------------------------------------------------------------------------
macro_processes:
  schema_version: '1.0'
  model_note: MacroProcess, KnowledgeBundle (capítulo) e SDLCPhase são TRÊS SEGMENTAÇÕES do mesmo substrato — agregações/percursos
    diferentes de olhar para o processo de desenvolvimento segundo SbD — e não níveis de uma hierarquia nem partições umas
    das outras; nenhuma relação entre as três se tipa como contenção. `MP → capítulos` é «percurso publicado», e é só isso.
    Os rótulos MP1–MP5 são ontology-owned (MP-0N); não são IDs de requisito.
  sdlc_phase_traversal:
    status: unpublished_gap
    reason: 'a travessia MP↔fase existe mas é PARCIAL e NÃO PUBLICADA: um MP atravessa várias fases e não necessariamente
      na íntegra; uma fase pode conter partes de vários MP. O Manual publica por MP o percurso de CAPÍTULOS, nunca um percurso
      de fases («fase» ocorre uma única vez no capítulo, na frase que nega a equivalência). Lacuna declarada — NÃO derivar
      a travessia a partir de capítulos/assignments.'
    decided_by: programme-lead 2026-09-06 (adenda à ratificação)
  edge_typing_rule: consumo que aparece nas «Entradas» do MP consumidor ⇒ dependency; consumo que aparece nos «Gatilhos»
    do consumidor ou nas realimentações declaradas (fecho, laço, realimentar, «nos seus gatilhos») ⇒ feedback. Cada aresta
    vive em outputs[].consumed_by com o artefacto (via) e refs.
  adoption_order_rule: 'ordem topológica do subconjunto dependency (feedback excluído por definição): MP-01 → {MP-02 ∥ MP-04}
    → MP-03 → MP-05; MP-02 e MP-04 são incomparáveis na fonte (declarado, não inferido).'
  counts:
    macro_processes: 5
    inter_mp_typed_pairs: 18
    dependency_pairs: 9
    feedback_pairs: 9
    consumption_records: 23
    path_edges: 22
  erratum_vs_gate_map: 'o mapa ratificado dizia 17 pares; na emissão a aplicação da regra ratificada à fonte encontrou a
    18.ª — MP2→MP4 («threat model … consumido por MP4: risco aceite entra na cadeia de autoridade», CLA-007), tipada feedback
    porque não figura nas Entradas de MP4; declarada aqui, nunca silenciada.'
  curation:
    curator: archon-2026-09-06
    ratified_by: programme-lead
    ratified_on: '2026-09-06'
    source: agentic/briefs/2026-09-06-archon-proposta-macro-processos.md
    adenda: três segmentações + lacuna de fases (2026-09-06)
  ref_conventions: refs com padrão [A-Z]{3}-\d{3} / REQ-AGN-\d{3} são Requirement ids validados; [A-Z]{3}-K\d{2} são metric_id
    validados; US-nn@cc refere a user story nn do capítulo cc (validação na materialização, Codex); F-0n e T-0n são a estrutura
    de medição transversal do cap. 14 — refs textuais declaradas não-modeladas (lacuna para o ciclo de assurance); restantes
    refs são âncoras editoriais textuais.

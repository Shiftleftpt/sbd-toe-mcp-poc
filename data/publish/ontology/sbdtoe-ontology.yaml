  - mp_id: MP-04
    label: MP4
    name_pt: Autorizar → Agir / Excecionar
    name_en: AUTHORISE → ACT / EXCEPT
    continuity: Autoridade e agência
    invariant: Papéis, deveres de fornecedor, automatismos e exceções exigem autoridade explícita e evidência retida.
    question: Quem pode fazer isto — e onde fica registado?
    provenance:
      source: 'SbD-ToE-Manual: 010-sbd-manual/00-fundamentos/macro-processos.md'
      anchor: '#mp4-autorizar-agir-excecionar'
      manual_pin: v1.8.0 f78dfe734a83b01fa9283c2df5a3eb0ba9528001
    traverses_bundles:
    - 00-fundamentos
    - 13-formacao-onboarding
    - 14-governanca-contratacao
    - 02-requisitos-seguranca
    path_edges:
    - from: 00-fundamentos
      to:
      - 13-formacao-onboarding
      kind: fluxo
      via_refs:
      - GOV-002
      - 13 papéis canónicos
    - from: 13-formacao-onboarding
      to:
      - 14-governanca-contratacao
      kind: fluxo
      via_refs:
      - TRN-004
      - TRN-005
    - from: 14-governanca-contratacao
      to: acção ou exceção registada
      kind: fluxo
      via_refs:
      - GOV-003
      - GOV-004
    - from: 14-governanca-contratacao
      to:
      - 02-requisitos-seguranca
      kind: ramo
      via_refs:
      - REQ-AGN-001
      note: 'ramo automatismos: alçadas → mandate A0–A4'
    scope_subjects:
    - subject: person_in_role
      refs:
      - colaborador, owner, aprovador
    - subject: supplier
      refs:
      - TRN-007
      - GOV-013
    - subject: ai_agent
      refs:
      - A1+
      - REQ-AGN-001
    triggers:
    - text: Entrada/mudança de função; designação ou rotação de owner
      refs:
      - US-01@13
      - TRN-002
      - US-09@14
    - text: Onboarding de fornecedor/contractor; revisão periódica de acesso; offboarding
      refs:
      - GOV-007
      - GOV-013
      - GOV-014
      - US-17@14
    - text: Pedido de exceção; expiração (90 dias por defeito) ou trigger fora de prazo
      refs:
      - processo canónico, passo 1
    - text: Novo agente ou mudança de nível/scope/allowlist (reabre proposta → aprovação)
      refs:
      - US-15@02
    - text: Emergency deploy (aprovação post-facto ≤ 24h, notificação a Gestão Executiva/CISO)
      refs:
      - exceções de deploy (cap. 11)
    inputs:
    - text: Modelo formal de governação + 13 papéis
      refs:
      - GOV-001
    - text: Classificação por nível (MP1) que fixa as alçadas
      refs:
      - GOV-003
    - text: Trilhos de formação por perfil/nível; contratos com cláusulas
      refs:
      - TRN-001
      - GOV-006
    - text: Esquema mínimo de mandate (Policy 38)
      refs:
      - US-15@02
    activities:
    - order: 1
      text: Definir papéis e atribuir ownership por aplicação
      refs:
      - GOV-001
      - GOV-002
      - US-09@14
    - order: 2
      text: Condicionar a autoridade à competência (onboarding validado; formação contínua; terceiros equivalente)
      refs:
      - TRN-002
      - TRN-004
      - TRN-005
      - TRN-007
    - order: 3
      text: Exercer a autoridade dentro das alçadas (L1/L2/L3)
      refs:
      - GOV-003
    - order: 4
      text: Excecionar pelo processo canónico em seis passos
      refs:
      - GOV-004
      - GOV-005
    - order: 5
      text: Aplicar especificidades por domínio sem substituir o processo
      refs:
      - gestão de exceções por capítulo
    - order: 6
      text: Mandatar automatismos e agentes (mandate em VCS; aprovação por nível A1–A4)
      refs:
      - REQ-AGN-001
      - REQ-AGN-002
      - US-15@02
    - order: 7
      text: Governar terceiros (validação, preparação pré-acesso, revisão, remoção no próprio dia)
      refs:
      - GOV-007
      - GOV-013
      - GOV-014
    - order: 8
      text: Reter a evidência da decisão (artefactos referenciáveis; registo consolidado)
      refs:
      - GOV-009
      - GOV-008
    outputs:
    - text: Registo de exceções ativo (validade + cadeia de autoridade)
      consumed_by:
      - mp: MP-05
        kind: dependency
        via: indicadores de exceções
        refs:
        - GOV-K02
        - GOV-K03
        - GOV-K04
      - mp: MP-01
        kind: feedback
        via: risco residual aceite com owner e TTL re-entra na reavaliação
        refs:
        - CLA-007
      - mp: MP-02
        kind: feedback
        via: idem, no desenho
        refs:
        - CLA-007
    - text: Mandate referenciável (mandate_ref)
      consumed_by:
      - mp: MP-03
        kind: dependency
        via: audit events por tool invocation; identidade de pipeline
        refs:
        - OPS-012
        - US-19@07
    - text: Aprovação de deploy por papel autorizado
      consumed_by:
      - mp: MP-03
        kind: dependency
        via: promoção
        refs:
        - DPL-001
    - text: Acesso concedido/revisto/revogado com evidência
      consumed_by:
      - mp: MP-05
        kind: dependency
        via: indicadores de acesso e formação
        refs:
        - TRN-K03
        - GOV-K01
    owner_role: grc-compliance
    participant_roles:
    - gestao-executiva
    - appsec-engineer
    - scrum-master
    - product-owner
    - security-champion
    - developer
    - fornecedores-terceiros
    - auditores
    control_points:
    - text: Acesso bloqueado até onboarding validado
      refs:
      - TRN-004
      - US-01@13
    - text: Aprovação formal explícita, nominal e registada (sem aprovações tácitas)
      refs:
      - processo canónico
    - text: Expiração (90 dias por defeito) — não renovação = não conformidade ativa
      refs:
      - GOV-005
    - text: Revisão periódica de acesso de terceiros com remoção no próprio dia
      refs:
      - GOV-014
      - US-19@14
    - text: Reabertura do ciclo do mandate a cada mudança; kill-switch exercitado
      refs:
      - US-15@02
      - REQ-AGN-003
    - text: Separação entre sinal automático e decisão
      refs:
      - US-15@07
      - US-16@10
      - US-16@11
    expected_evidence:
    - text: Registo de exceção completo com cadeia de autoridade
      refs:
      - processo canónico
    - text: Certificados/LMS; bloqueios de acesso; ready-for-access de terceiros
      refs:
      - US-01@13
      - US-15@14
    - text: Mandate versionado com mandate_ref; audit events
      refs:
      - REQ-AGN-001
      - OPS-012
    - text: Checklist de revisão de acesso; designação de owner
      refs:
      - US-19@14
      - US-09@14
    - text: Artefactos de decisão referenciáveis
      refs:
      - GOV-009
    indicators:
    - GOV-K02
    - GOV-K03
    - GOV-K04
    - GOV-K01
    - TRN-K02
    - TRN-K03
    - CIC-K02
    ai_agentic_extension:
      text: 'O agente é o caso de maior distância capacidade↔autoridade: o que está autorizado é o que o mandate declara'
      refs:
      - REQ-AGN-001
      - REQ-AGN-002
      - REQ-AGN-003
      - REQ-AGN-004
    proportionality_l1_l3:
      L1: exceção aprovada pelo responsável técnico; onboarding básico obrigatório; terceiros recomendado
      L2: aprovação AppSec + responsável; formação contínua semestral
      L3: AppSec + GRC/CISO com medida compensatória obrigatória; trimestral

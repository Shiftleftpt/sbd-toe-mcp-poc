catalogue_rules:
  schema_version: '1.0'
  # v2.2 (2026-08-30, decisão do programme lead pré-G-b): os requisitos do catálogo-base do cap. 02 (type: base, 104)
  # ligam-se a controlos por REGRA DE CATÁLOGO (categoria → controlo, com overrides por requisito), com confiança declarada
  # como regra e justification: catalogue_rule; o scoring lexical NÃO corre sobre type: base. A curadoria prevalece sempre.
  applies_to:
    requirement_type: base
    requirement_ids_count: 121  # v2.3: 104 (Manual v1.7.1) + 17 (Manual v1.8.0 `f78dfe734a83b01fa9283c2df5a3eb0ba9528001`: FIL 8 + PRI 5 + INT-009…012)
  precedence:
  - curation
  - catalogue_rule
  - scoring
  lexical_scoring_on_base: false
  confidence:
    primary: 0.92
    secondary: 0.8
  justification:
    primary: catalogue_rule
    secondary: catalogue_rule_secondary
  source_mode: catalogue_rule
  authority_class: normative
  confidence_model: deterministic
  max_links_per_requirement: 2
  curation_interaction: "Se o requisito tem primária curada (retarget/add-primary), a regra não cria primária; fornece no máximo a secundária declarada aqui, se ainda houver lugar. Arestas curadas nunca são substituídas por regra."
  fallback_expectation: "domain_owner_fallback deve ser 0 para type: base; qualquer sobra é reportada como desvio."
